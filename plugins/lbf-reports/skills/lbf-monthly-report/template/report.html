<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Monthly report</title>
<!--
  LBF monthly report template. build.py fills it; never edit it per client.
  Each page template element (data-page attribute) is one page layout, 960 x 540 pt when printed.
  Each layout is written in a small template language (see build.py):
    {{path}}  {{#each path limit=N}} {{/each}}  {{#if path}} {{else}} {{/if}}  {{> partial}}
  The fonts (Poppins, SIL Open Font License, see fonts/OFL.txt), the agency wordmark
  and the channel icons are embedded at the end of <head>.
-->
<style>
@page { size: 960pt 540pt; margin: 0; }
:root {
  --bg: #000;
  --ink: #fff;
  --muted: #c4c4c4;
  --card: #f4f4f4;
  --card-ink: #1d2025;
  --card-muted: #6b6f76;
  --line: #dcdcdc;
  --accent: #74c043;
  --accent-soft: #e3f1d8;
  --up: #2e8540;
  --down: #c8452c;
  --flat: #6b6f76;
  --bar: #252a31;
  --placeholder: #d4d6d3;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--bg); }
body { font-family: "Poppins", sans-serif; -webkit-print-color-adjust: exact; print-color-adjust: exact; }

section.page {
  width: 1280px; height: 720px; overflow: hidden; position: relative;
  background: var(--bg); color: var(--ink);
  padding: 38px 59px 0 59px;
  display: flex; flex-direction: column;
  break-after: page; page-break-after: always;
}
section.page:last-child { break-after: auto; page-break-after: auto; }

/* header: kicker, heading, takeaway */
.client-logo { position: absolute; top: 30px; right: 59px; height: 60px; width: 170px; display: flex; justify-content: flex-end; align-items: center; }
.client-logo img { max-height: 60px; max-width: 170px; object-fit: contain; }
.client-logo .name { font-weight: 700; font-size: 16px; text-align: right; line-height: 1.15; }
.kicker { font-weight: 600; font-size: 15px; letter-spacing: .24em; text-transform: uppercase; color: var(--accent); line-height: 1; margin-top: 10px; }
.title { display: flex; align-items: center; gap: 12px; margin-top: 10px; padding-right: 200px; }
.title h1 { margin: 0; font-weight: 800; font-size: 44px; line-height: 1; text-transform: uppercase; letter-spacing: -.005em; }
.title .ic { width: 42px; height: 42px; }
.takeaway {
  margin: 10px 0 0; font-weight: 600; font-size: 19px; line-height: 1.38; max-width: 1162px;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.body { flex: 1; min-height: 0; margin-top: 18px; display: flex; flex-direction: column; gap: 16px; }

/* footer */
.foot { height: 78px; flex: none; display: flex; align-items: center; gap: 28px; font-size: 14px; color: var(--muted); line-height: 1.45; }
.foot .left { flex: 1; min-width: 0; }
.foot .center { flex: none; max-width: 560px; text-align: right; }
.foot .wordmark { flex: none; height: 30px; width: auto; display: block; }

/* icons */
.ic { display: inline-block; flex: none; border-radius: 9px; background-size: cover; background-position: center; }
.ic-none { display: none; }

/* cards */
.card { background: var(--card); color: var(--card-ink); border-radius: 12px; }
.row { display: flex; gap: 16px; }
.row > * { flex: 1 1 0; min-width: 0; }
.stat { padding: 13px 16px 12px; }
.stat .lab { font-weight: 600; font-size: 14.5px; letter-spacing: .05em; text-transform: uppercase; color: #555a61; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat .val { font-weight: 700; font-size: 29px; line-height: 1.25; margin-top: 3px; white-space: nowrap; }
.stat .mom { font-weight: 500; font-size: 15px; margin-top: 1px; }
.up { color: var(--up); } .down { color: var(--down); } .flat { color: var(--flat); }
.mom.flat, .mom.neutral { color: #555a61; }

.panel { padding: 16px 20px; }
.panel h3 { margin: 0 0 8px; font-weight: 600; font-size: 17px; line-height: 1.2; }
.note { font-size: 13px; color: var(--card-muted); margin-top: 8px; }

table.t { width: 100%; border-collapse: collapse; font-size: 14px; }
table.t th { text-align: left; font-weight: 600; padding: 4px 8px 7px; color: var(--card-ink); }
table.t td { padding: 7px 8px; border-top: 1px solid #e6e6e6; }
table.t tr:first-child td { border-top: 0; }
table.t .n { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
table.t tr.hl td { background: var(--accent-soft); }
table.t tr.total td { background: var(--accent-soft); font-weight: 500; }
table.t .clip { max-width: 0; width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* image frames: always 4:5, cropped to fill, never wider than 1:1 */
.frame { aspect-ratio: 4 / 5; border-radius: 8px; overflow: hidden; background: var(--placeholder); flex: none; }
.frame img { width: 100%; height: 100%; object-fit: cover; display: block; }

.clamp1 { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.clamp2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

/* bars */
.bars { display: flex; flex-direction: column; gap: 9px; }
.bar-row { display: grid; align-items: center; gap: 12px; font-size: 14px; }
.bar-track { height: 16px; position: relative; }
.bar-fill { height: 100%; background: var(--bar); border-radius: 3px; min-width: 6px; }
.bar-fill.accent { background: var(--accent); }
.bar-val { font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; }

/* ---------- cover ---------- */
.cover { padding: 46px 59px 40px; justify-content: space-between; }
.cover .top { display: flex; justify-content: space-between; align-items: flex-start; }
.cover .eyebrow { font-weight: 600; font-size: 15px; letter-spacing: .2em; text-transform: uppercase; }
.cover .when { text-align: right; }
.cover .when .m { font-weight: 600; font-size: 15px; letter-spacing: .2em; text-transform: uppercase; }
.cover .when .asof { font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin-top: 8px; }
.cover .logo { display: flex; justify-content: center; align-items: center; height: 300px; }
.cover .logo img { max-height: 210px; max-width: 520px; object-fit: contain; }
.cover .logo .name { font-weight: 800; font-size: 54px; text-transform: uppercase; text-align: center; }
.cover .bottom { display: flex; justify-content: space-between; align-items: flex-end; }
.cover .by .lab { font-weight: 600; font-size: 13px; letter-spacing: .24em; text-transform: uppercase; }
.cover .by .who { font-weight: 700; font-size: 22px; margin-top: 8px; }
.cover .wordmark { height: 30px; }

/* ---------- key outcomes ---------- */
.ko { flex: none; display: flex; gap: 16px; }
.ko .left { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 16px; }
.ko .tiles { flex: 1 1 0; min-height: 0; }
.ko .tiles.paid { flex-grow: 1.45; }
.ko .tiles:only-child { flex: none; }
.tile { padding: 14px 18px 14px; }
.tile .hd { display: flex; align-items: center; gap: 8px; }
.tile .hd .ic { width: 22px; height: 22px; border-radius: 5px; }
.tile .hd .name { font-weight: 600; font-size: 16px; }
.tile .hd .tag { margin-left: auto; font-size: 14px; color: var(--card-muted); }
.tile .big { display: flex; align-items: baseline; gap: 10px; margin-top: 4px; }
.tile .big .v { font-weight: 700; font-size: 34px; line-height: 1.2; }
.tile .big .m { font-weight: 600; font-size: 16px; }
.tile .sub { font-size: 14px; color: #4b4f55; margin-top: 2px; }
.tile .cells { display: flex; gap: 14px; margin-top: 10px; }
.tile .cells > div { flex: 1; min-width: 0; }
.tile .cells .cl { font-size: 14px; color: #4b4f55; white-space: nowrap; }
.tile .cells .cv { font-weight: 600; font-size: 15px; white-space: nowrap; }
.tile .cells .cm { font-weight: 600; font-size: 13px; }
.ko .post { flex: none; width: 250px; padding: 12px; display: flex; flex-direction: column; }
.ko .post .frame { width: 226px; }
.ko .post .lab { font-weight: 600; font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: #4b4f55; margin-top: 10px; }
.ko .post .cap { font-weight: 600; font-size: 15px; line-height: 1.3; margin-top: 3px; }
.ko .post .meta { font-size: 13px; color: var(--card-muted); margin-top: 3px; }
.ko .post .st { font-weight: 600; font-size: 14px; margin-top: 3px; }

/* ---------- ads tiles ---------- */
.ads { display: flex; gap: 16px; flex: none; }
.ad { flex: 0 0 auto; width: calc((100% - 64px) / 5); padding: 12px 18px 12px; }
.ad .frame { width: 100%; }
.ad .nm { font-weight: 600; font-size: 16px; margin-top: 9px; line-height: 1.25; }
.ad .l1 { font-size: 15px; color: var(--card-muted); margin-top: 2px; }
.ad .l2 { font-weight: 600; font-size: 15px; margin-top: 2px; }

/* ---------- google ---------- */
.g2 { flex: 1; min-height: 0; display: flex; gap: 16px; align-items: flex-start; }
.g2 .wide { flex: 1.9 1 0; min-width: 0; }
.g2 .narrow { flex: 1 1 0; min-width: 0; }
.g2 .next { font-size: 13.5px; color: var(--card-muted); margin-top: 10px; }
.terms .bar-row { grid-template-columns: 1fr 40px; gap: 6px 10px; }
.terms .term { grid-column: 1 / -1; display: flex; justify-content: space-between; font-size: 14px; }
.terms .bar-track { height: 6px; grid-column: 1 / -1; background: #e6e6e6; border-radius: 3px; }

/* ---------- instagram / facebook ---------- */
.deep { flex: 1; min-height: 0; display: flex; gap: 22px; }
.deep .shot { flex: 1 1 0; min-width: 0; padding: 14px; display: flex; align-items: center; justify-content: center; background: #fff; }
.deep .shot img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; }
.deep .shot.empty { background: var(--placeholder); color: #555; font-size: 15px; }
.deep .side { flex: none; width: 456px; display: flex; flex-direction: column; gap: 16px; min-height: 0; }
.ftile { padding: 10px 18px 11px; }
.ftile .l1 { display: flex; align-items: baseline; gap: 10px; }
.ftile .l1 .n { font-weight: 700; font-size: 20px; }
.ftile .l1 .m { font-weight: 600; font-size: 16px; }
.ftile .l1 .tot { margin-left: auto; font-size: 16px; color: #4b4f55; white-space: nowrap; }
.ftile .l2 { font-size: 15px; color: #4b4f55; margin-top: 1px; }
.dposts { display: flex; gap: 16px; flex: 1; min-height: 0; }
.dpost { flex: 1 1 0; min-width: 0; padding: 8px 8px 10px; display: flex; flex-direction: column; min-height: 0; }
.dpost .frame { width: 100%; }
.dpost .nm { font-weight: 600; font-size: 17px; margin-top: 8px; line-height: 1.25; }
.dpost .s { font-size: 15px; color: #4b4f55; line-height: 1.45; }

/* ---------- tiktok ---------- */
.tt { flex: 1; min-height: 0; display: flex; gap: 16px; align-items: flex-start; }
.tt .eng { flex: none; width: 278px; }
.kv { display: flex; justify-content: space-between; font-size: 14.5px; padding: 8px 0; border-top: 1px solid #e3e3e3; }
.kv:first-of-type { border-top: 0; }
.kv b { font-weight: 700; }
.tt .vids { flex: 1; min-width: 0; }
.vrow { display: flex; gap: 22px; }
.vid { flex: 0 0 calc((100% - 44px) / 3); min-width: 0; }
.vid .frame { width: 124px; }
.vid .tx { min-width: 0; margin-top: 8px; }
.vid .nm { font-weight: 600; font-size: 14.5px; line-height: 1.3; }
.vid .s { font-size: 13.5px; color: #4b4f55; margin-top: 3px; line-height: 1.5; white-space: nowrap; }

/* ---------- linkedin ---------- */
.li { flex: 1; min-height: 0; display: flex; gap: 16px; align-items: flex-start; }
.li .wide { flex: 2 1 0; min-width: 0; }
.li .narrow { flex: 1 1 0; min-width: 0; }
.ind .bar-row { grid-template-columns: 1fr 44px; gap: 5px 10px; }
.ind .nm { font-size: 14px; }
.ind .bar-track { height: 6px; grid-column: 1 / -1; background: #e6e6e6; border-radius: 3px; }
.ind .bar-fill { background: var(--accent); }

/* ---------- emailers ---------- */
.em { flex: none; display: flex; gap: 16px; }
.em .main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 16px; }
.em .creative { flex: none; width: 236px; border-radius: 12px; overflow: hidden; background: var(--placeholder); position: relative; }
.em .creative img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }
.funnel .bar-row { grid-template-columns: 160px 1fr; }
.funnel .bar-track { display: flex; align-items: center; gap: 10px; }
.funnel .bar-fill { flex: none; }
.funnel .bar-val { text-align: left; }

/* ---------- what worked ---------- */
.ww { display: flex; gap: 16px; align-items: flex-start; }
.wcard { flex: 1 1 0; min-width: 0; padding: 14px 16px 16px; }
.wcard .top { display: flex; gap: 14px; align-items: flex-start; }
.wcard .frame { width: 92px; }
.wcard .top .tx { min-width: 0; padding-top: 6px; }
.wcard .fd { font-size: 14px; color: var(--card-muted); }
.wcard .nm { font-weight: 700; font-size: 17px; line-height: 1.25; margin-top: 2px; }
.wcard .er { font-weight: 700; font-size: 16px; color: var(--up); margin-top: 2px; }
.wcard .st { font-size: 13.5px; color: var(--card-muted); margin-top: 8px; }
.wcard .h { font-weight: 700; font-size: 14px; letter-spacing: .04em; text-transform: uppercase; color: #555a61; margin-top: 10px; }
.wcard .h.g { color: var(--up); }
.wcard .p { font-size: 14px; line-height: 1.45; margin-top: 3px; }

/* ---------- content insights ---------- */
.ci { display: flex; gap: 16px; align-items: flex-start; }
.ci .wide { flex: 1.75 1 0; min-width: 0; }
.ci .narrow { flex: 1 1 0; min-width: 0; }
.fmt .bar-row { grid-template-columns: 96px 1fr; }
.fmt .bar-track { display: flex; align-items: center; gap: 10px; }
.fmt .bar-fill { flex: none; height: 16px; }
.fmt .bar-row:first-child .bar-fill { background: var(--accent); }
.dkr { display: flex; gap: 16px; }
.dkr > div { flex: 1 1 0; min-width: 0; border: 1.5px solid var(--accent); border-radius: 10px; padding: 12px 16px; }
.dkr .h { font-weight: 700; font-size: 14.5px; letter-spacing: .05em; text-transform: uppercase; color: var(--accent); }
.dkr .p { font-size: 14px; line-height: 1.45; margin-top: 4px; }

/* ---------- competitors ---------- */
.comp .hd { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.comp .hd .ic { width: 22px; height: 22px; border-radius: 5px; }
.comp table.t td { padding: 9px 8px; font-size: 15px; }
.comp table.t th { font-size: 15px; }
.comp .wait { color: var(--card-muted); }

/* ---------- looking ahead ---------- */
.la { display: flex; gap: 16px; align-items: flex-start; }
.la .dates { flex: none; width: 306px; background: var(--accent); color: #0f1a08; border-radius: 12px; padding: 16px 20px 18px; }
.la .dates h3 { margin: 0 0 6px; font-weight: 600; font-size: 17px; }
.la .dates .d { font-weight: 700; font-size: 17px; margin-top: 10px; line-height: 1.25; }
.la .dates .l { font-size: 14px; line-height: 1.4; }
.la .blocks { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 12px; }
.la .blk { padding: 13px 18px 14px; }
.la .blk h3 { margin: 0; font-weight: 600; font-size: 17px; }
.la .blk p { margin: 4px 0 0; font-size: 14px; line-height: 1.45; color: #33373c; }
.la .blocks.solo { max-width: 860px; }
</style>

<template data-page="key-outcomes" data-kicker="The month" data-title="Key outcomes"><section class="page" data-page="key-outcomes">
  {{> head}}
  <div class="body">
    <div class="ko">
      <div class="left">
        {{#if page.channelTiles}}<div class="row tiles">{{#each page.channelTiles limit=3}}<div class="card tile">
          <div class="hd"><span class="ic ic-{{icon}}"></span><span class="name">{{label}}</span><span class="tag">{{tag}}</span></div>
          <div class="big"><span class="v">{{f.display}}</span>{{#if f.mom}}<span class="m {{f.mom.direction}}">{{f.mom.display}}</span>{{/if}}</div>
          {{#if subLine}}<div class="sub">{{subLine}}</div>{{/if}}
        </div>{{/each}}</div>{{/if}}
        {{#if page.paidTiles}}<div class="row tiles paid">{{#each page.paidTiles limit=2}}<div class="card tile">
          <div class="hd"><span class="ic ic-{{icon}}"></span><span class="name">{{label}}</span><span class="tag">{{tag}}</span></div>
          <div class="big"><span class="v">{{f.display}}</span>{{#if f.mom}}<span class="m {{f.mom.direction}}">{{f.mom.display}}</span>{{/if}}</div>
          {{#if subLine}}<div class="sub">{{subLine}}</div>{{/if}}
          {{#if cells}}<div class="cells">{{#each cells limit=4}}<div><div class="cl">{{label}}</div><div class="cv">{{f.display}}</div>{{#if f.mom}}<div class="cm {{f.mom.direction}}">{{f.mom.display}}</div>{{/if}}</div>{{/each}}</div>{{/if}}
        </div>{{/each}}</div>{{/if}}
      </div>
      {{#if page.topPost}}<div class="card post">
        <div class="frame">{{#if page.topPost.img}}<img src="{{page.topPost.img}}" alt="">{{/if}}</div>
        <div class="lab">Top post · {{page.topPost.platformLabel}}</div>
        <div class="cap clamp2">{{page.topPost.caption}}</div>
        <div class="meta">{{page.topPost.dateLabel}} · {{page.topPost.format}}</div>
        <div class="st">{{page.topPost.viewsDisplay}} views · {{page.topPost.likesDisplay}} likes</div>
        <div class="st">{{page.topPost.savesDisplay}} saves · {{page.topPost.sharesDisplay}} shares</div>
      </div>{{/if}}
    </div>
  </div>
  {{> foot}}
</section></template>

<template data-page="meta-ads" data-kicker="Paid media" data-title="Meta ads" data-icon="meta"><section class="page" data-page="meta-ads">
  {{> head}}
  <div class="body">
    <div class="row">{{> stats}}</div>
    {{#if page.ads}}<div class="ads">{{#each page.ads limit=5}}<div class="card ad">
      <div class="frame">{{> img}}</div>
      <div class="nm clamp1">{{name}}</div>
      <div class="l1 clamp1">{{line1}}</div>
      <div class="l2 clamp1">{{line2}}</div>
    </div>{{/each}}</div>{{/if}}
  </div>
  {{> foot}}
</section></template>

<template data-page="google-ads" data-kicker="Paid media" data-title="Google ads" data-icon="google"><section class="page" data-page="google-ads">
  {{> head}}
  <div class="body">
    <div class="row">{{> stats}}</div>
    <div class="g2">
      {{#if page.campaigns}}<div class="card panel wide">
        <h3>By campaign</h3>
        <table class="t">
          <tr><th>Campaign</th><th class="n">Spend</th><th class="n">Clicks</th><th class="n">Conv.</th><th class="n">Cost / conv.</th></tr>
          {{#each page.campaigns limit=5}}<tr><td class="clip">{{name}}</td><td class="n">{{spendDisplay}}</td><td class="n">{{clicksDisplay}}</td><td class="n">{{convDisplay}}</td><td class="n">{{costPerConvDisplay}}</td></tr>{{/each}}
          {{#if page.campaignsTotal}}<tr class="total"><td>Total</td><td class="n">{{page.campaignsTotal.spendDisplay}}</td><td class="n">{{page.campaignsTotal.clicksDisplay}}</td><td class="n">{{page.campaignsTotal.convDisplay}}</td><td class="n">{{page.campaignsTotal.costPerConvDisplay}}</td></tr>{{/if}}
        </table>
        {{#if copy.nextLine}}<div class="next">{{copy.nextLine}}</div>{{/if}}
      </div>{{/if}}
      {{#if page.searchTerms}}<div class="card panel narrow terms">
        <h3>Top search terms</h3>
        <div class="bars">{{#each page.searchTerms limit=5}}<div class="bar-row"><div class="term"><span class="clamp1">{{term}}</span><b>{{clicksDisplay}}</b></div><div class="bar-track"><div class="bar-fill accent" style="width: {{barPct}}%"></div></div></div>{{/each}}</div>
        <div class="note">Clicks per term</div>
      </div>{{/if}}
    </div>
  </div>
  {{> foot}}
</section></template>

<template data-partial="deep"><div class="body">
    <div class="deep">

      <div class="side">
        {{#if page.followersTile.newF}}<div class="card ftile">
          <div class="l1"><span class="n">{{page.followersTile.newF.display}} new followers</span>{{#if page.followersTile.newF.mom}}<span class="m {{page.followersTile.newF.mom.direction}}">{{page.followersTile.newF.mom.display}}</span>{{/if}}{{#if page.followersTile.totalF}}<span class="tot">Total {{page.followersTile.totalF.display}}</span>{{/if}}</div>
          {{#if page.followersTile.subLine}}<div class="l2">{{page.followersTile.subLine}}</div>{{/if}}
        </div>{{/if}}
        <div class="dposts">{{#each page.posts limit=2}}<div class="card dpost">
          <div class="frame">{{> img}}</div>
          <div class="nm clamp1">{{name}}</div>
          <div class="s">{{viewsDisplay}} views · {{likesDisplay}} likes</div>
          <div class="s">{{savesDisplay}} saves · {{sharesDisplay}} shares</div>
        </div>{{/each}}</div>
      </div>
    </div>
  </div></template>

<template data-page="content-insights" data-kicker="What worked" data-title="Content insights"><section class="page" data-page="content-insights">
  {{> head}}
  <div class="body">
    <div class="ci">
      {{#if page.pillars}}<div class="card panel wide">
        <h3>By content pillar</h3>
        <table class="t">
          <tr><th>Pillar</th><th class="n">Posts</th><th class="n">Avg reach</th><th class="n">Eng. rate</th></tr>
          {{#each page.pillars limit=6}}<tr{{#if best}} class="hl"{{/if}}><td class="clip">{{pillar}}</td><td class="n">{{postsDisplay}}</td><td class="n">{{avgReachDisplay}}</td><td class="n">{{engRateDisplay}}</td></tr>{{/each}}
        </table>
        {{#if page.postCountLine}}<div class="note">{{page.postCountLine}} · best pillar highlighted</div>{{/if}}
      </div>{{/if}}
